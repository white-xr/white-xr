name: Generate Contribution Snake

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate monochrome contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Uses SNAKE_TOKEN (classic PAT with read:user) when configured so
          # private/internal contribution counts can be included.
          github_token: ${{ secrets.SNAKE_TOKEN || github.token }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23111111&color_dots=%23EBEDF0,%23D0D7DE,%23A8B0B8,%236B7280,%23111111
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23F5F5F5&color_dots=%23161B22,%2330363D,%23545D66,%239AA1A9,%23E6E8EA

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
