name: Generate Contribution Snake

on:
  schedule:
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: contribution-snake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile source
        uses: actions/checkout@v4

      - name: Test contribution verification
        run: python -m unittest discover -s scripts -p 'test_check_snake.py'

      - name: Verify private contribution visibility
        env:
          PROFILE_LOGIN: ${{ github.repository_owner }}
          SNAKE_TOKEN: ${{ secrets.SNAKE_TOKEN }}
          ACTIONS_TOKEN: ${{ github.token }}
        run: python scripts/check_snake.py snapshot --snapshot "$RUNNER_TEMP/snake-calendar.json"

      - name: Generate monochrome contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Uses SNAKE_TOKEN (classic PAT with read:user) when configured so
          # private/internal contribution counts can be included.
          github_token: ${{ secrets.SNAKE_TOKEN || github.token }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23111111&color_dots=%23EBEDF0,%23D0D7DE,%23A8B0B8,%236B7280,%23111111
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23F5F5F5&color_dots=%23161B22,%2330363D,%23545D66,%239AA1A9,%23E6E8EA

      - name: Verify both SVG grids against contribution data
        run: python scripts/check_snake.py verify --snapshot "$RUNNER_TEMP/snake-calendar.json" --output-dir dist

      - name: Generate monochrome system pulse
        env:
          PROFILE_TOKEN: ${{ secrets.SNAKE_TOKEN || github.token }}
        run: >-
          python scripts/generate_profile_metrics.py
          --username "${{ github.repository_owner }}"
          --output-dir dist

      - name: Publish profile assets to output branch
        if: github.ref == 'refs/heads/main'
        uses: crazy-max/ghaction-github-pages@v5
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
